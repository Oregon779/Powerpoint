# Präsentations-Website. __SERVER_NAME__ wird von install.sh durch Domain oder IP ersetzt.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/praesentationen;
    index index.html;
    charset utf-8;

    # Sicherheitsmodus: existiert diese Datei, sehen Besucher nur die Hinweisseite (HTTP 503).
    # Schalten mit „sudo praes-wartung an/aus“ oder über den geheimen Admin-Link.
    set $wartung "";
    if (-f /var/www/praesentationen/p/.wartung) { set $wartung 1; }
    error_page 503 /wartung.html;

    # Live-Abfrage für offene Seiten (alle 2 s): beantwortet nginx direkt, auch im Sicherheitsmodus
    location = /wartung-status {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        if ($wartung) { return 200 '{"wartung":true}'; }
        return 200 '{"wartung":false}';
    }

    location = /wartung.html {
        add_header Cache-Control "no-store" always;
    }

    # Admin-Seite und -Schnittstelle bleiben im Sicherheitsmodus erreichbar
    location = /admin.html {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex" always;
    }

    location /api/admin/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /p/.wartung {
        return 404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
    }

    location = /p/list.json {
        if ($wartung) { return 503; }
        add_header Cache-Control "no-store";
    }

    location /p/ {
        if ($wartung) { return 503; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        if ($wartung) { return 503; }
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        if ($wartung) { return 503; }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
