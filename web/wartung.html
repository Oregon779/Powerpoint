<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080F">
<meta name="robots" content="noindex">
<title>Sicherheitsmodus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Wird von nginx bei aktivem Sicherheitsmodus für jede Adresse ausgeliefert (HTTP 503). Muss eigenständig sein. */
:root { --bg: #05080F; --panel: rgba(18,26,44,.62); --line: rgba(220,228,240,.10); --line-2: rgba(220,228,240,.22);
  --ink: #F5F7FB; --muted: #97A4B9; --gold: #C8955A; --gold-hi: #F0C48A; --danger: #FF6B6B;
  --f: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: 1fr auto; color: var(--ink); font-family: var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .35; }
.aurora i:nth-child(1) { background: var(--danger); left: -20vmax; top: -25vmax; opacity: .22; animation: drift 24s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { background: var(--gold); right: -20vmax; bottom: -30vmax; animation: drift 28s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(10vmax, 8vmax) scale(1.1); } }
main { display: grid; place-items: center; padding: calc(32px + env(safe-area-inset-top, 0px)) 16px 32px; }
.card { width: 100%; max-width: 560px; text-align: center; padding: clamp(28px, 6vw, 48px) clamp(20px, 5vw, 44px); border-radius: 28px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 40px 100px -40px rgba(0,0,0,.8);
  backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); animation: rise .8s cubic-bezier(.2,.75,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.98); } }
.shield { position: relative; width: 92px; height: 92px; margin: 0 auto 26px; display: grid; place-items: center; border-radius: 28px;
  background: linear-gradient(140deg, rgba(240,196,138,.22), rgba(200,149,90,.06)); border: 1px solid rgba(240,196,138,.35); }
.shield::before { content: ""; position: absolute; inset: -1px; border-radius: 28px; box-shadow: 0 0 0 0 rgba(240,196,138,.45); animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 22px rgba(240,196,138,0); } 100% { box-shadow: 0 0 0 0 rgba(240,196,138,0); } }
.shield svg { width: 46px; height: 46px; fill: var(--gold-hi); }
.tag { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-hi);
  padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(240,196,138,.3); background: rgba(240,196,138,.06); }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 10px var(--danger); }
h1 { margin: 18px 0 0; font-size: clamp(28px, 6vw, 40px); font-weight: 800; letter-spacing: -.8px; line-height: 1.1; }
p { margin: 16px auto 0; max-width: 440px; color: var(--muted); font-size: clamp(16px, 2.4vw, 18px); line-height: 1.6; }
p strong { color: var(--ink); font-weight: 700; }
.wait { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.wait i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); border-top-color: var(--gold-hi); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
footer { padding: 22px 16px calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center; }
.powered { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
.powered b { font-weight: 800; color: var(--gold-hi); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i></div>
<main>
  <div class="card" role="alert">
    <div class="shield" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5zm0 6a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-3 0v-4A1.5 1.5 0 0 1 12 7m0 8.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3"/></svg></div>
    <span class="tag">Sicherheitsmodus</span>
    <h1>Die Webseite ist vorübergehend gesperrt</h1>
    <p>Die Webseite wurde wegen <strong>technischen Schwierigkeiten</strong> in einen Sicherheitsmodus gestellt. Bitte kontaktieren Sie einen <strong>Admin dieser Webseite</strong>.</p>
    <div class="wait"><i></i>Die Seite lädt automatisch neu, sobald sie wieder verfügbar ist.</div>
  </div>
</main>
<footer><span class="powered">Powered by <b>Stone Plugins</b></span></footer>
<script>
// Alle 15 Sekunden nachsehen, ob der Sicherheitsmodus vorbei ist, dann zur Startseite
setInterval(async () => {
  try {
    const r = await fetch('/p/list.json', { cache: 'no-store' });
    if (r.ok) location.href = '/';
  } catch (e) {}
}, 15000);
</script>
</body>
</html>
